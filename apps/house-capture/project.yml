name: HouseCapture
options:
  bundleIdPrefix: com.toldwell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HouseCapture:
    type: application
    platform: iOS
    sources: [HouseCapture]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.toldwell.roomscan
        # Sarah Howell's team, the account Tiles ships under (Will's call, 2026-10-24).
        # Signed with the team key in tw-vault (ASC_KEY_*), not an Xcode account.
        DEVELOPMENT_TEAM: 5KB4D246F2
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    info:
      path: HouseCapture/Info.plist
      properties:
        CFBundleDisplayName: 3D Model Anything
        NSCameraUsageDescription: 3D Model Anything uses the camera and LiDAR scanner to measure your rooms and take reference photos.
        # Non-LiDAR devices can import and review scans; capture is checked at runtime.
        ITSAppUsesNonExemptEncryption: false
        HouseCapturePrivacyURL: "https://wesbos.github.io/3d-model-anything/privacy.html"
        HouseCaptureSupportURL: "https://wesbos.github.io/3d-model-anything/support.html"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        # camera/AR app: no iPad split view, which also means portrait-only is allowed
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
